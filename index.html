<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Samuel Croset - Data Science and Biology</title>
  <link rel="shortcut icon" href="assets/favico.ico" type="image/x-icon">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html { height: 100%; font-family: Consolas, Menlo, Monaco, "Lucida Console", "Courier New", monospace; }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    /* Background GIF */
    .bg {
      position: fixed;
      inset: 0;
      background: url('assets/tubes-background.gif') no-repeat center center;
      background-size: cover;
      z-index: 0;
    }

    /* Pixelate the background */
    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px),
        repeating-linear-gradient(90deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
      z-index: 1;
    }

    /* CRT scanlines */
    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 1px,
        rgba(0, 0, 0, 0.3) 1px,
        rgba(0, 0, 0, 0.3) 2px
      );
      pointer-events: none;
      z-index: 2;
    }

    /* CRT vignette (dark edges) */
    .vignette {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 3;
    }

    /* Subtle screen flicker */
    @keyframes flicker {
      0% { opacity: 0.97; }
      5% { opacity: 0.95; }
      10% { opacity: 0.98; }
      15% { opacity: 0.96; }
      20% { opacity: 0.97; }
      50% { opacity: 0.98; }
      80% { opacity: 0.96; }
      90% { opacity: 0.98; }
      100% { opacity: 0.97; }
    }

    .crt-flicker {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 4;
      animation: flicker 0.15s infinite;
      background: transparent;
    }

    /* Content */
    .container {
      position: relative;
      z-index: 5;
    }

    h1 {
      font-size: 5rem;
      margin-bottom: 10px;
      color: rgb(0, 255, 0);
      text-shadow: 
        0 0 6px rgba(0, 255, 0, 0.55),
        0 0 16px rgba(0, 255, 0, 0.3),
        0 0 30px rgba(0, 255, 0, 0.15);
      animation: textGlow 3s ease-in-out infinite alternate;
    }

    @keyframes textGlow {
      from {
        text-shadow: 
          0 0 6px rgba(0, 255, 0, 0.55),
          0 0 16px rgba(0, 255, 0, 0.3),
          0 0 30px rgba(0, 255, 0, 0.15);
      }
      to {
        text-shadow: 
          0 0 8px rgba(0, 255, 0, 0.7),
          0 0 24px rgba(0, 255, 0, 0.45),
          0 0 50px rgba(0, 255, 0, 0.2);
      }
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 20px;
      color: white;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
    }

    .links {
      margin-top: 50px;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      color: rgb(0, 255, 0);
      text-decoration: none;
      font-size: 0.95rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      text-shadow: 0 0 5px rgba(0, 255, 0, 0.4);
    }

    .links a:hover {
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 255, 0, 0.8);
    }

    .links svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="crt-flicker"></div>
